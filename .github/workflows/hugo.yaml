name: Build and deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: '0.169.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        env:
          HUGO_TAR: hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.tar.gz
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/${HUGO_TAR}"
          mkdir -p "${HOME}/.local/hugo"
          tar -C "${HOME}/.local/hugo" -xf "${HUGO_TAR}"
          rm "${HUGO_TAR}"

          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Install lftp
        run: |
          # Installing lftp - Sophisticated file transfer program
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Install poppler utils and pdftk
        run: |
          # Installing poppler-utils PDF manipulation library
          sudo apt-get install -y poppler-utils pdftk

      - name: Install rclone
        run: |
          # Installing rclone
          sudo apt-get install -y rclone

      - name: Verify installations
        run: |
          echo 'Hugo:'
          hugo version   | cat -n
          echo '-----'
          echo 'lftp:'
          lftp --version | cat -n
          echo '-----'
          echo 'pdftk:'
          pdftk --version | cat -n
          echo '-----'
          echo 'rclone:'
          rclone --version | cat -n
          echo '-----'

      - name: Make Sunday divine liturgy text
        env:
          RCLONE_CONNECTION: ":b2,account='${{secrets.RCLONE_CONFIG_B2_ACCOUNT||',key='${{secrets.RCLONE_CONFIG_B2_KEY}}'"
        run: |
          # Create sunday.pdf
          set -o errexit
          ./make-sunday-liturgy.sh <sunday-liturgy.json >static/sunday.pdf

      - name: Build the site
        run: |
          hugo build

          cp content/bulletins/*.pdf public/bulletins
          cp content/about-us/scholarships/*.pdf public/about-us/scholarships
          mkdir public/doc
          cp static/sunday.pdf public/doc

      - name: Check PDF
        run: |
          (
            workdir="$(pwd)"
            cd "${workdir}/public"
            md5sum --check <(
              cd "${workdir}/content"
              md5sum {bulletins,about-us/scholarships}/*.pdf
            )
          )

      - name: Publish to ololc.org
        env:
          FTP_HOST: ${{vars.FTP_HOST}}
          FTP_USER: ${{vars.FTP_USER}}
          FTP_PASS: ${{secrets.FTP_PASS}}
        run: |
          # Run lftp to mirror ./public to ftp host
          cd public
          lftp <<-EOF
          	set ssl:check-hostname no
          	open ${FTP_HOST} -u ${FTP_USER},${FTP_PASS}
          	cd /www
          	mirror --reverse --verbose=1 --no-perms --no-umask --ignore-time
            put index.html
          	# mirror --reverse --verbose=1 --no-perms --no-umask
          	exit
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ololc-org-site
          path: ./public

